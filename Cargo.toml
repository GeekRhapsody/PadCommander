[package]
name = "pad-commander"
version = "2.0.1"
edition = "2024"
rust-version = "1.85"
description = "Gamepad-first two-pane graphical file manager for Windows and Linux."
keywords = ["windows", "linux", "file-manager", "gamepad", "egui"]
categories = ["filesystem", "gui"]
build = "build.rs"

[dependencies]
eframe = "0.34.3"
egui_extras = { version = "0.34", features = ["image"] }
gilrs = "0.11.2"
chrono = "0.4.45"
image = { version = "0.25.10", default-features = false, features = ["ico", "png"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
zip = "2"
unarc-rs = "0.6"
suppaftp = { version = "6.3.0", features = ["rustls"] }
chacha20poly1305 = "0.11.0"
base64 = "0.23.1"
webpki-roots = "1.0.11"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.61.3", features = ["Win32_Foundation", "Win32_System_Com", "Win32_UI_Shell"] }
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_Storage_FileSystem", "Win32_UI_Shell"] }

[target.'cfg(target_os = "linux")'.dependencies]
libc = "0.2"
trash = "5"

[target.'cfg(windows)'.build-dependencies]
winresource = "0.1.31"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = "symbols"
