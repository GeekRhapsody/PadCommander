[package]
name = "handheld-commander"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
description = "Windows-only gamepad-first two-pane graphical file manager."
keywords = ["windows", "file-manager", "gamepad", "egui"]
categories = ["filesystem", "gui"]
build = "build.rs"

[dependencies]
eframe = "0.34.3"
gilrs = "0.11.2"
chrono = "0.4.45"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
windows = { version = "0.61.3", features = ["Win32_Foundation", "Win32_System_Com", "Win32_UI_Shell"] }
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_Storage_FileSystem", "Win32_UI_Shell"] }
zip = "2"

[target.'cfg(windows)'.build-dependencies]
winresource = "0.1.31"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = "symbols"
