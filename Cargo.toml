[package]
name = "handheld-commander"
version = "0.1.0"
edition = "2024"

[dependencies]
eframe = "0.34.3"
gilrs = "0.11.2"
chrono = "0.4.45"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
windows = { version = "0.61.3", features = ["Win32_Foundation", "Win32_System_Com", "Win32_UI_Shell"] }
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_Storage_FileSystem", "Win32_UI_Shell"] }
zip = "2"
