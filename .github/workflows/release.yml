name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  windows:
    name: Build Windows release
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Cargo fmt
        run: cargo fmt --check

      - name: Build release binary
        run: cargo build --release

      - name: Package release binary
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Compress-Archive -Path target\release\pad-commander.exe -DestinationPath dist\pad-commander-${{ github.ref_name }}-windows-x86_64.zip -Force

      - name: Upload package
        uses: actions/upload-artifact@v4
        with:
          name: windows
          path: dist/*

  linux:
    name: Build Linux release
    # Oldest supported Ubuntu runner keeps the glibc requirement low enough for SteamOS and most distros.
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install system libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y libudev-dev libxkbcommon-dev libwayland-dev libx11-dev libxcursor-dev libxrandr-dev libxi-dev libgl1-mesa-dev

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Cargo fmt
        run: cargo fmt --check

      - name: Build release binary
        run: cargo build --release

      - name: Package tarball
        run: |
          mkdir -p dist
          tar -czf dist/pad-commander-${{ github.ref_name }}-linux-x86_64.tar.gz -C target/release pad-commander

      - name: Package AppImage
        env:
          APPIMAGE_EXTRACT_AND_RUN: 1
          OUTPUT: dist/pad-commander-${{ github.ref_name }}-linux-x86_64.AppImage
        run: |
          wget -q https://github.com/linuxdeploy/linuxdeploy/releases/download/continuous/linuxdeploy-x86_64.AppImage
          chmod +x linuxdeploy-x86_64.AppImage
          ./linuxdeploy-x86_64.AppImage \
            --appdir AppDir \
            --executable target/release/pad-commander \
            --desktop-file assets/linux/pad-commander.desktop \
            --icon-file assets/linux/pad-commander.png \
            --output appimage

      - name: Upload packages
        uses: actions/upload-artifact@v4
        with:
          name: linux
          path: dist/*

  publish:
    name: Publish GitHub release
    needs: [windows, linux]
    runs-on: ubuntu-latest

    steps:
      - name: Download packages
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
