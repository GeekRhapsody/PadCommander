name: Windows Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    name: Build and publish release
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Cargo fmt
        run: cargo fmt --check

      - name: Build release binary
        run: cargo build --release

      - name: Package release binary
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Compress-Archive -Path target\release\pad-commander.exe -DestinationPath dist\pad-commander-${{ github.ref_name }}-windows-x86_64.zip -Force

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/pad-commander-${{ github.ref_name }}-windows-x86_64.zip
          generate_release_notes: true
